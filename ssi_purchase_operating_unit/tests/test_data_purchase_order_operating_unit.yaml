scenarios:
  - name: "Purchase Order - Create with Operating Unit"
    steps:
      - step: "Setup - create purchase order type"
        action: "create"
        model: "purchase_order_type"
        save_as: "po_type_ou"
        values:
          name: "OU PO Type"
          code: "OUPT001"

      - step: "Setup - create vendor"
        action: "create"
        model: "res.partner"
        save_as: "vendor_ou"
        values:
          name: "Test Vendor OU"
          supplier_rank: 1

      - step: "Setup - create product"
        action: "create"
        model: "product.product"
        save_as: "product_ou"
        values:
          name: "Test Product OU"
          type: "consu"
          purchase_ok: true

      - step: "Setup - get or create operating unit"
        action: "search"
        model: "operating.unit"
        domain:
          - ["code", "!=", false]
        save_as: "operating_unit"
        limit: 1

      - step: "Create purchase order with operating unit"
        action: "create"
        model: "purchase.order"
        save_as: "po_ou"
        as_user: "base.user_admin"
        values:
          partner_id: "EVAL: registry['vendor_ou'].id"
          type_id: "EVAL: registry['po_type_ou'].id"
          operating_unit_id: "EVAL: registry['operating_unit'].id"

      - step: "Create purchase order line"
        action: "create"
        model: "purchase.order.line"
        save_as: "po_line_ou"
        as_user: "base.user_admin"
        values:
          order_id: "EVAL: registry['po_ou'].id"
          product_id: "EVAL: registry['product_ou'].id"
          product_qty: 5.0
          price_unit: 200.0
          name: "Test Product OU"
          date_planned: "2026-06-01"

      - step: "Invalidate cache after line creation"
        action: "call"
        target: "po_ou"
        method: "invalidate_cache"

      - step: "Assert purchase order created in draft"
        action: "assert"
        target: "po_ou"
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step: "Confirm purchase order with operating unit"
        action: "call"
        target: "po_ou"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Invalidate cache after confirm"
        action: "call"
        target: "po_ou"
        method: "invalidate_cache"

      - step: "Approve purchase order with operating unit"
        action: "call"
        target: "po_ou"
        method: "action_approve_approval"
        as_user: "base.user_admin"

      - step: "Invalidate cache after approve"
        action: "call"
        target: "po_ou"
        method: "invalidate_cache"

      - step: "Assert purchase order in purchase state"
        action: "assert"
        target: "po_ou"
        asserts:
          state:
            type: "value"
            expected: "purchase"
